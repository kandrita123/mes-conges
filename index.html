<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#18202E; --muted:#5D6779; --line:#D5DBE5;
  --ca:#B04FB3; --ca-soft:#F4DDF4; --rtt:#5A2D9C; --rtt-soft:#E3DAF3;
  --rc:#1690A3; --rc-soft:#D4F0F4; --ri:#B9770E; --ri-soft:#F7E8CC;
  --neg:#C62828; --neg-soft:#FBE1E1; --ok:#2E7D32; --accent:#1F4FA8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1C2331; --ink:#E8ECF3; --muted:#9AA4B6; --line:#2E3747;
    --ca:#E08AE3; --ca-soft:#3E2441; --rtt:#B39AEE; --rtt-soft:#2E2647;
    --rc:#5FCFE0; --rc-soft:#173B42; --ri:#F0B44E; --ri-soft:#3E3018;
    --neg:#FF7B7B; --neg-soft:#47201F; --ok:#7BD07F; --accent:#8EB4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1C2331; --ink:#E8ECF3; --muted:#9AA4B6; --line:#2E3747;
  --ca:#E08AE3; --ca-soft:#3E2441; --rtt:#B39AEE; --rtt-soft:#2E2647;
  --rc:#5FCFE0; --rc-soft:#173B42; --ri:#F0B44E; --ri-soft:#3E3018;
  --neg:#FF7B7B; --neg-soft:#47201F; --ok:#7BD07F; --accent:#8EB4FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header h1{font-size:1.6rem;margin:4px 0 2px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.92rem}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.ctr{background:var(--surface);border-radius:14px;padding:12px 14px 12px 16px;position:relative;overflow:hidden}
.ctr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.ctr .name{font-weight:700;font-size:.95rem}
.ctr .big{font-size:2rem;font-weight:700;line-height:1.1;margin:4px 0 6px}
.ctr .big small{font-size:1rem;font-weight:400;color:var(--muted)}
.ctr.neg{background:var(--neg-soft)}
.ctr.neg .big{color:var(--neg)}
.ctr .calc{font-size:.8rem;color:var(--muted);line-height:1.35}
.tabs{display:flex;gap:6px;margin:20px 0 12px;background:var(--surface);padding:4px;border-radius:12px}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:10px 1px;border-radius:9px;font:inherit;font-size:.72rem;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;font-weight:700}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#0E1525}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#0E1525}}
.month{font-weight:700;margin:18px 0 6px;font-size:.95rem;text-transform:capitalize}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:6px;width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.item.past{opacity:.55}
.chip{flex:0 0 auto;min-width:56px;text-align:center;font-weight:700;font-size:.85rem;padding:5px 8px;border-radius:8px;background:var(--cs);color:var(--ct,var(--c))}
.item .main{flex:1;min-width:0}
.item .d{font-weight:700}
.item .n{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:400}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.card{background:var(--surface);border-radius:14px;padding:16px}
label{display:block;font-size:.88rem;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 6px;font:inherit;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--c,var(--accent));background:var(--cs,var(--accent));color:var(--ct,#fff);font-weight:700}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn{color:#0E1525}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1525}}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg)}
.btn.wide{width:100%;margin-top:16px}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .btn{flex:1}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:1.8rem;line-height:1;padding:0;box-shadow:0 4px 14px rgba(20,30,60,.25)}
dialog{border:0;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,15,30,.45)}
dialog h2{margin:0 0 4px;font-size:1.2rem}
.cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}
.cmp th,.cmp td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp .bad{color:var(--neg);font-weight:700}
.cmp .good{color:var(--ok)}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.hist{margin-top:10px}
.hist .h{background:var(--surface);border-radius:12px;padding:12px;margin-bottom:8px}
.status{font-size:.8rem;color:var(--muted);margin-top:24px;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toggle{background:none;border:0;color:var(--accent);font:inherit;font-size:.88rem;padding:8px 0;cursor:pointer}
:root,:root[data-theme="dark"]{
  --ca:#F4B6E4;--ca-soft:#F4B6E4;--ca-t:#6B1F57;
  --rtt:#7030A0;--rtt-soft:#7030A0;--rtt-t:#FFFFFF;
  --rc:#33CCCC;--rc-soft:#33CCCC;--rc-t:#063B3B;
  --fl:#FF14B4;--fl-soft:#FF14B4;--fl-t:#FFFFFF;
  --ri-t:#8A5808;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ca:#F4B6E4;--ca-soft:#F4B6E4;--ca-t:#6B1F57;
  --rtt:#7030A0;--rtt-soft:#7030A0;--rtt-t:#FFFFFF;
  --rc:#33CCCC;--rc-soft:#33CCCC;--rc-t:#063B3B;
  --fl:#FF14B4;--fl-soft:#FF14B4;--fl-t:#FFFFFF;
}}

:root{--vac:#2F7DE1;--ast:#D32F2F;--offbg:#DDE2EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vac:#6AA8FF;--ast:#FF5C5C;--offbg:#283142}}
:root[data-theme="dark"]{--vac:#6AA8FF;--ast:#FF5C5C;--offbg:#283142}
.mode{display:flex;gap:6px;margin:10px 0 0}
.mode button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:8px 6px;font:inherit;font-size:.88rem;cursor:pointer}
.mode button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.years{display:flex;gap:6px;align-items:center;margin:14px 0 4px}
.years button{flex:1;font-size:1.05rem!important;padding:9px 6px!important}
.years button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.years .sp{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);margin:8px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0}
.day{position:relative;height:50px;border-radius:7px;background:var(--surface);border:0;padding:0;font:inherit;color:var(--ink);overflow:hidden;cursor:pointer}
.day.blank{background:none;cursor:default}
.day.off{background:var(--offbg)}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day .n{position:absolute;top:2px;left:3px;font-size:.7rem;font-weight:700;z-index:3;background:var(--surface);border-radius:4px;padding:0 3px;line-height:1.3}
.day.off .n{background:var(--offbg)}
.day .f{position:absolute;top:2px;right:3px;font-size:.6rem;color:var(--muted);z-index:3}
.half{position:absolute;left:0;right:0;height:50%;background:var(--cs);z-index:1}
.half.am{top:0}.half.pm{bottom:0}
.half.part{bottom:0;height:34%}
.half.hypo{background:repeating-linear-gradient(135deg,var(--cs) 0 5px,transparent 5px 9px);outline:1px dashed var(--c);outline-offset:-1px}
.day.vac::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--vac);z-index:2}
.day.ast::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--ast);z-index:2}
.day.fer{background:var(--surface)}
.day.fer .n{background:var(--surface);color:#E0A800}
.day.fer .f{color:#E0A800;font-weight:700;font-size:.62rem}
.warn{color:var(--neg);font-size:.85rem;font-weight:700;margin:10px 0 0}
.daytags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.aide details{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.aide summary{font-weight:700;cursor:pointer}
.aide h3{font-size:.95rem;margin:14px 0 4px}
.aide p,.aide li{font-size:.92rem;line-height:1.5}
.aide ol,.aide ul{padding-left:20px;margin:6px 0}
.aide .key{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:700;font-size:.82rem}
.btn.ghost,:root .btn.ghost{color:var(--ink)}
.btn.danger,:root .btn.danger{color:var(--neg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}:root:not([data-theme="light"]) .btn.danger{color:var(--neg)}}
:root[data-theme="dark"] .btn.ghost{color:var(--ink)}:root[data-theme="dark"] .btn.danger{color:var(--neg)}
.past{margin:10px 0 4px}
.past>summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--accent);padding:10px 12px;background:var(--surface);border-radius:10px;list-style:none}
.past>summary::-webkit-details-marker{display:none}
.past>summary::before{content:"▸ ";}
.past[open]>summary::before{content:"▾ ";}
.past[open]{padding-bottom:8px;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PGI suivi perso</h1>
    <p id="sub">Chargement…</p>
  </header>
  <div class="years" id="years"></div>
  <section id="bilan"></section>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="annee" aria-selected="true">Calendrier</button>
    <button role="tab" data-tab="plan" aria-selected="false">Liste</button>
    <button role="tab" data-tab="ast" aria-selected="false">Astreintes</button>
    <button role="tab" data-tab="pgi" aria-selected="false">PGI</button>
    <button role="tab" data-tab="set" aria-selected="false">Réglages</button>
    <button role="tab" data-tab="aide" aria-selected="false">Aide</button>
  </nav>
  <main id="view"></main>
  <p class="status" id="status"></p>
</div>
<button class="btn fab" id="fab" aria-label="Poser une absence">+</button>
<dialog id="dlg"><form method="dialog" id="mform"></form></dialog>
<script>

const C = {
  CA:{name:"Congés annuels",short:"CA",c:"--ca",cs:"--ca-soft",u:"h"},
  RTT:{name:"Réduction horaire dû",short:"RD",c:"--rtt",cs:"--rtt-soft",u:"h"},
  RC:{name:"RC",short:"RC",c:"--rc",cs:"--rc-soft",u:"h"},
  FL:{name:"Fête locale",short:"FL",c:"--fl",cs:"--fl-soft",u:"j"}
};
const KEYS = Object.keys(C);
const KIND = {absence:"Absence", cet:"Versement CET", credit:"Acquisition", perte:"Écrêtement"};
const MOM = {jour:"Journée", am:"Matin", pm:"Après-midi", heures:"Heures"};
// Horaires de référence : 7h45-12h et 12h45-16h30
const toMin = t => { const [h,mi] = String(t||"0:0").split(":").map(Number); return h*60+(mi||0); };
function hoursBetween(de, a){ const d = toMin(de), f = toMin(a); if (f <= d) return 0;
  const pause = Math.max(0, Math.min(f, 765) - Math.max(d, 720)); return Math.round((f-d-pause)/60*100)/100; }
// Vacances scolaires zone C par défaut (jours sans classe, bornes incluses). Modifiables dans Réglages.
const DEFAULT_VAC = [
  {n:"Noël 2025", debut:"2025-12-20", fin:"2026-01-04"},
  {n:"Hiver 2026", debut:"2026-02-21", fin:"2026-03-08"},
  {n:"Printemps 2026", debut:"2026-04-18", fin:"2026-05-03"},
  {n:"Pont de l’Ascension 2026", debut:"2026-05-14", fin:"2026-05-17"},
  {n:"Été 2026", debut:"2026-07-04", fin:"2026-08-31"},
  {n:"Toussaint 2026", debut:"2026-10-17", fin:"2026-11-01"},
  {n:"Noël 2026", debut:"2026-12-19", fin:"2027-01-03"},
  {n:"Hiver 2027", debut:"2027-02-06", fin:"2027-02-21"},
  {n:"Printemps 2027", debut:"2027-04-03", fin:"2027-04-18"},
  {n:"Pont de l’Ascension 2027", debut:"2027-05-06", fin:"2027-05-09"},
  {n:"Été 2027", debut:"2027-07-03", fin:"2027-09-01"},
  {n:"Toussaint 2027", debut:"2027-10-23", fin:"2027-11-07"},
  {n:"Noël 2027", debut:"2027-12-18", fin:"2028-01-02"},
  {n:"Hiver 2028", debut:"2028-02-12", fin:"2028-02-27"},
  {n:"Printemps 2028", debut:"2028-04-15", fin:"2028-05-01"},
  {n:"Pont de l’Ascension 2028", debut:"2028-05-25", fin:"2028-05-28"},
  {n:"Été 2028 (fin estimée)", debut:"2028-07-05", fin:"2028-08-31"}
];
const vacPairs = () => (state.vacances||[]).map(v=>[v.debut, v.fin]);
const SOL = {off:"Jour non travaillé", worked:"Jour travaillé, 7 h posées", ca:"Rien posé : 7 h de CA au 31/12"};

const SEED = {releves:[], mouvements:[]};
let state = {releves:[], mouvements:[], solidarite:{}, astreintes:[], vacances:[]};
let pastOpen = false;
let tab = "annee", view = "reel", showPast = false, store = null, saveTimer = null, calYear = new Date().getFullYear();

const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(",", ".").replace(/\s/g,"")); return isNaN(n) ? 0 : n; };
const fmt = n => (Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2});
const fdate = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const flong = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
const fday = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const pad = n => String(n).padStart(2,"0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s??"").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const colorVars = k => `--c:var(${C[k].c});--cs:var(${C[k].cs});--ct:var(${C[k].c}-t)`;
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = toD(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const dow = s => toD(s).getUTCDay();

const ferCache = {};
function feries(y){
  if (ferCache[y]) return ferCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const E = `${y}-${pad(mo)}-${pad(da)}`;
  return ferCache[y] = new Set([`${y}-01-01`, addDays(E,1), `${y}-05-01`, `${y}-05-08`, addDays(E,39), addDays(E,50), `${y}-07-14`, `${y}-08-15`, `${y}-11-01`, `${y}-11-11`, `${y}-12-25`]);
}
const isFerie = s => feries(+s.slice(0,4)).has(s);
const isWE = s => { const w = dow(s); return w===0 || w===6; };
const isWork = s => !isWE(s) && !isFerie(s);
const isVac = s => vacPairs().some(([a,b]) => s>=a && s<=b);
// Été (périodes longues) : liseré seulement le premier et le dernier jour
const vacMark = s => vacPairs().some(([a,b]) => (toD(b)-toD(a) > 20*864e5) ? (s===a || s===b) : (s>=a && s<=b));
const astOn = s => (state.astreintes||[]).find(a => s>=a.debut && s<=a.fin);
function workDays(a,b){ let n=0; for (let s=a; s<=b; s=addDays(s,1)) if (isWork(s)) n++; return n; }
function astConflict(m){ const fin = m.fin||m.date; for (let s=m.date; s<=fin; s=addDays(s,1)) if (isWork(s) && (state.astreintes||[]).some(a => s>a.debut && s<=a.fin)) return true; return false; }

function solMvts(){
  const out = [];
  for (const [y,s] of Object.entries(state.solidarite||{})){
    if (!s) continue;
    if (s.mode==="ca") out.push({id:"sol-"+y, date:y+"-12-31", c:"CA", h:7, kind:"absence", note:"Journée de solidarité : décompte automatique", virt:true});
    else if (s.date) out.push({id:"sol-"+y, date:s.date, c:s.c||"RC", h:7, kind:"absence", note:"Journée de solidarité : "+SOL[s.mode].toLowerCase(), virt:true});
  }
  return out;
}
const DEF_DROITS = {RTT:260, CA:189, FL:1};
const DROIT_DATE = {RTT:"01-01", CA:"05-01", FL:"01-01"};
const DROITS_START = 2027;
const droits = () => ({...DEF_DROITS, ...(state.droits||{})});
function droitsMvts(){
  const ys = state.mouvements.filter(m=>m.kind!=="credit").map(m=>+m.date.slice(0,4));
  const maxY = Math.max(new Date().getFullYear(), ...ys);
  const out = [], d = droits();
  for (let y=DROITS_START; y<=maxY; y++) for (const k of Object.keys(DEF_DROITS)) if (d[k]>0)
    out.push({id:`dr-${k}-${y}`, date:`${y}-${DROIT_DATE[k]}`, c:k, h:d[k], kind:"credit", note:`Droits ${y} (automatique)`, virt:true});
  return out;
}
const baseM = incH => state.mouvements.filter(m => incH || m.statut!=="hypo").concat(solMvts(), droitsMvts());
const allM = incH => baseM(incH).concat(ecretMvts());
// Écrêtement prévisionnel au 1er janvier : CA au-delà de 70 h perdus, RC au-delà de 100 h écrêtées
let _ecret = null;
function ecretMvts(){
  if (_ecret) return _ecret;
  const out = []; _ecret = out;
  const ys = state.mouvements.map(m=>+m.date.slice(0,4));
  const maxY = Math.max(new Date().getFullYear(), ...ys);
  for (let y=2026; y<=maxY; y++) for (const [k,cap] of [["CA",capCA()],["RC",capRC()]]){
    const v = soldeAt(k, `${y}-12-31`);
    if (v!==null && v > cap + 0.009) out.push({id:`ec-${k}-${y}`, date:`${y+1}-01-01`, c:k, h:Math.round((v-cap)*100)/100, kind:"perte", note:`Écrêtement au-delà de ${cap} h (perdu)`, virt:true});
  }
  return out;
}

function lastReleve(before){
  const r = state.releves.filter(x => !before || x.date < before).sort((a,b)=>a.date.localeCompare(b.date));
  return r[r.length-1] || null;
}
function delta(k, from, to){ // effet du réel dans (from, to] — jamais les hypothèses
  let d = 0;
  for (const m of allM(false)){
    if (m.c !== k) continue;
    if (from && m.date <= from) continue;
    if (to && m.date > to) continue;
    d += m.kind === "credit" ? m.h : -m.h;
  }
  return d;
}
function anchor(k, end, strict, skipRel){
  let best = null;
  const take = (date, v) => { if (strict ? date >= end : date > end) return; if (!best || date > best.date) best = {date, v}; };
  for (const r of state.releves) if (r.soldes && r.soldes[k]!==undefined) take(r.date, num(r.soldes[k]));
  if (!skipRel && (k==="CA" || k==="RC")) for (const rl of Object.values(state.reliquats||{})) if (rl && rl[k]!=null && rl.date) take(rl.date, num(rl[k]));
  return best;
}
function soldeAt(k, end, skipRel){
  const a = anchor(k, end, false, skipRel);
  if (!a) return null;
  let v = a.v;
  for (const m of allM(true)){ if (m.c!==k || m.date<=a.date || m.date>end) continue; v += m.kind==="credit" ? m.h : -m.h; }
  return v;
}
function yearsList(){
  const ys = state.mouvements.map(m=>+m.date.slice(0,4)).concat((state.astreintes||[]).map(a=>+a.debut.slice(0,4)));
  const max = Math.max(new Date().getFullYear()+1, ...ys);
  const out = []; for (let y=2026; y<=max; y++) out.push(y); return out;
}

}

function rangeLabel(m){
  if (m.fin && m.fin !== m.date) return `${fdate(m.date)} → ${fdate(m.fin)}`;
  if (m.moment==="heures" && m.de) return `${fdate(m.date)} (${m.de.replace(":","h")}–${m.a.replace(":","h")})`;
  return fdate(m.date) + (m.moment && m.moment!=="jour" ? ` (${MOM[m.moment].toLowerCase()})` : "");
}
function itemHTML(m, past){
  const sign = m.kind === "credit" ? "+" : "−";
  const tags = [`<span class="tag">${C[m.c].short}</span>`];

}

// --- Vue année ---
function dayItems(s){
  const out = [];
  for (const m of allM(true)){
    if (m.kind!=="absence") continue;
    const fin = m.fin || m.date;
    if (s < m.date || s > fin) continue;
    if (fin !== m.date && !isWork(s)) continue;
    const wd = fin===m.date ? 1 : Math.max(1, workDays(m.date, fin));
    const perDay = C[m.c].u==="j" ? 8 : m.h / wd;
    let place = m.moment==="am" ? "am" : m.moment==="pm" ? "pm" : m.moment==="heures" && m.de ? (perDay >= 6 ? "full" : (Math.max(0, Math.min(toMin(m.a),720) - toMin(m.de)) >= Math.max(0, toMin(m.a) - Math.max(toMin(m.de),765)) ? "am" : "pm")) : perDay >= 6 ? "full" : "part";
    out.push({m, place});
  }
  return out;
}
function dayCell(s){
  const cls = ["day"];
  if (!isWork(s)) cls.push("off");
  if (isFerie(s)) cls.push("fer");
  if (vacMark(s)) cls.push("vac");
  if (astOn(s)) cls.push("ast");
  if (s===today()) cls.push("today");
  const its = dayItems(s);
  // Journée de référence 7h45-12h / 12h45-16h30 = 480 min de travail, du haut (7h45) au bas (16h30) de la case
  const toW = t => { const m = toMin(t); const w = m <= 720 ? m - 465 : m < 765 ? 255 : m - 510; return Math.min(480, Math.max(0, w)); };
  const hDay = ({m}) => { const fin = m.fin || m.date; const wd = fin===m.date ? 1 : Math.max(1, workDays(m.date, fin)); return C[m.c].u==="j" ? 8 : m.h / wd; };
  const iv = its.map(x => {
    const {m, place} = x, len = Math.min(480, hDay(x)*60);
    if (m.moment==="heures" && m.de) return {m, a:toW(m.de), b:toW(m.a)};
    if (place==="am") return {m, a:0, b:255};
    if (place==="pm") return {m, a:255, b:480};
    if (place==="full") return {m, a:0, b:480};
    return {m, a:null, len};
  });
  // Plages connues : positionnées à leur heure ; sans heure : placées à la suite, en bas
  let ok = iv.reduce((t,v)=>t + (v.a===null ? v.len : v.b - v.a), 0) <= 481;
  const known = iv.filter(v=>v.a!==null).sort((x,y)=>x.a-y.a);
  for (let i=1; i<known.length && ok; i++) if (known[i].a < known[i-1].b - 1) ok = false;
  if (ok){
    let cur = 480;
    for (const v of iv.filter(v=>v.a===null).reverse()){ v.b = cur; v.a = cur - v.len; cur = v.a; }
    if (iv.some(v=>v.a < -1) || (known.length && iv.some(v=>!known.includes(v) && v.a < Math.max(...known.map(k=>k.b)) - 1))) ok = false;
  }
  // Journée entièrement posée (du début à la fin, ou 7,5 h et plus) : bandes collées, sans vide de pause
  const totH = iv.reduce((t,v)=>t + hDay({m:v.m}), 0);
  if (ok && iv.length >= 2 && (totH >= 7.5 || (Math.min(...iv.map(v=>v.a)) <= 15 && Math.max(...iv.map(v=>v.b)) >= 465))) ok = false;
  if (!ok){
    // Chevauchement (ex. journée + journée de solidarité) : bandes empilées, proportionnelles aux heures posées
    const start = v => v.a ?? 999;
    const sorted = [...iv].sort((x,y)=>start(x)-start(y));
    const L = v => Math.min(480, hDay({m:v.m})*60);
    const tot = sorted.reduce((t,v)=>t + L(v), 0) || 1;
    let pos = 0;
    for (const v of sorted){ const l = L(v) * 480 / tot; v.a = pos; v.b = pos + l; pos += l; }
  }
  const inner = iv.map(v => {
    const top = v.a / 4.8, h = Math.max(12, (v.b - v.a) / 4.8);
    return `<span class="half ${v.m.statut==="hypo"?"hypo":""}" style="${colorVars(v.m.c)};top:${Math.min(top, 100-h).toFixed(2)}%;height:${h.toFixed(2)}%"></span>`;
  }).join("");
  return `<button class="${cls.join(" ")}" data-day="${s}"><span class="n">${+s.slice(8)}</span>${isFerie(s)?`<span class="f">férié</span>`:""}${inner}</button>`;
}
function renderAnnee(){
  const y = calYear;
  let html = `<div class="legend">
      ${KEYS.map(k=>`<span><i style="background:var(${C[k].cs})"></i>${C[k].short}</span>`).join("")}
      <span><i style="background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);outline:1px dashed var(--muted)"></i>Hypothèse</span>
      <span><i style="background:var(--vac);width:5px"></i>Vacances zone C</span>
      <span><i style="background:var(--ast);height:5px"></i>Astreinte</span>
      <span style="color:#E0A800;font-weight:700">Férié</span>
    </div>`;
  const dn = ["L","M","M","J","V","S","D"];
  const monthHTML = mo => {
    const first = `${y}-${pad(mo)}-01`;
    const nb = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    const lead = (dow(first)+6)%7;
    let h = `<div class="month" id="m${mo}">${new Date(first+"T12:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</div><div class="cal">${dn.map(d=>`<div class="dow">${d}</div>`).join("")}`;
    for (let i=0;i<lead;i++) h += `<span class="day blank"></span>`;
    for (let d=1; d<=nb; d++) h += dayCell(`${y}-${pad(mo)}-${pad(d)}`);
    return h + `</div>`;
  };
  // Année en cours : les mois écoulés sont repliés dans un menu
  const now = new Date(), curM = now.getMonth()+1;
  const nbPast = y === now.getFullYear() ? curM - 1 : 0;
  if (nbPast > 0){
    const nom = mo => new Date(`${y}-${pad(mo)}-15T12:00:00`).toLocaleDateString("fr-FR",{month:"long"});
    html += `<details class="past" id="pastMonths" ${pastOpen?"open":""}><summary>Mois passés (${nbPast===1 ? nom(1) : `${nom(1)} à ${nom(nbPast)}`})</summary>`;
    for (let mo=1; mo<=nbPast; mo++) html += monthHTML(mo);
    html += `</details>`;
  }
  for (let mo=nbPast+1; mo<=12; mo++) html += monthHTML(mo);
  return html;
}

// --- Bilan annuel / droits ---
function caSplit(y){
  // Reliquat = solde CA au 1er janvier ; les CA posés avant le 1er mai le consomment en premier
  const rl = (state.reliquats||{})[y];
  const rel = rl && rl.CA!=null ? num(rl.CA) : (soldeAt("CA", `${y}-01-01`) ?? 0);
  let pJA=0, hJA=0, pMD=0, hMD=0;
  for (const m of allM(true)){
    if (m.c!=="CA" || m.kind==="credit" || m.kind==="perte" || m.date<`${y}-01-01` || m.date>`${y}-12-31`) continue;
    const early = m.date < `${y}-05-01`;
    if (m.statut==="hypo"){ if (early) hJA += m.h; else hMD += m.h; }
    else { if (early) pJA += m.h; else pMD += m.h; }
  }
  const relPos = Math.max(0, rel);
  const nP = Math.min(pJA, relPos), nH = Math.min(hJA, relPos - nP);
  return {rel, nP, nH, restN1: relPos - nP - nH, overP: pJA - nP, overH: hJA - nH, pMD, hMD};
}
function renderBilan(y){
  const d = droits();
  const chip = (k, t) => `<span class="chip" style="${colorVars(k)};min-width:0;padding:2px 6px">${t}</span>`;
  const cell = v => v===null ? "–" : fmt(v);
  const row = (lab, dr, p, h, r) => `<tr><td>${lab}</td><td>${dr}</td><td>${fmt(p)}</td><td>${h?fmt(h):"–"}</td>
      <td class="${r!==null&&r<-0.009?"bad":""}" style="font-weight:700">${cell(r)}</td></tr>`;
  const ca = caSplit(y);
  let rows = "";
  for (const k of KEYS){
    if (k==="CA"){
      rows += row(chip("CA",`CA ${y-1}`), fmt(ca.rel), ca.nP, ca.nH, ca.restN1);
      const resteCA = soldeAt("CA", `${y}-12-31`);
      const drCA = ca.restN1 > 0.009 ? `${fmt(d.CA)}<div class="n" style="font-size:.72rem;color:var(--muted)">+ ${fmt(ca.restN1)} N-1</div>` : fmt(d.CA);
      rows += row(chip("CA",`CA ${y}`), drCA, ca.pMD + ca.overP, ca.hMD + ca.overH, resteCA ?? (d.CA + ca.restN1 - ca.pMD - ca.overP - ca.hMD - ca.overH));
      continue;
    }
    const [a,b] = [`${y}-01-01`, `${y}-12-31`];
    let pose = 0, hypo = 0;
    for (const m of allM(true)){
      if (m.c!==k || m.kind==="credit" || m.kind==="perte" || m.date<a || m.date>b) continue;
      if (m.statut==="hypo") hypo += m.h; else pose += m.h;
    }
    const reste = k==="RC" ? soldeAt("RC", b) : d[k] - pose - hypo;
    rows += row(chip(k, C[k].short), k==="RC" ? "–" : fmt(d[k]), pose, hypo, reste);
  }
  const warns = [];
  const fin = `${y}-04-30`;
  if (ca.restN1 > 0.009) warns.push(today() > fin
    ? `<p class="warn" style="margin:8px 0 0">${fmt(ca.restN1)} h de CA ${y-1} n’ont pas été posées avant le 30/04/${y}.</p>`
    : `<p class="warn" style="margin:8px 0 0;color:#B26A00">Reliquat CA ${y-1} : ${fmt(ca.restN1)} h restent à poser avant le 30/04/${y}.</p>`);
  else if (ca.rel > 0.009) warns.push(`<p class="hint" style="margin:8px 0 0">Reliquat CA ${y-1} entièrement posé avant le 30/04/${y}.</p>`);
  if (ca.overP + ca.overH > 0.009) warns.push(`<p class="warn" style="margin:8px 0 0">${fmt(ca.overP + ca.overH)} h de CA posées avant le 1er mai dépassent le reliquat : elles seront prises sur les CA ${y}, qui n’arrivent que le 1er mai (solde négatif dans PGI d’ici là).</p>`);
  return `<div class="card" style="padding:12px 14px;margin:8px 0">
    <table class="cmp" style="margin-top:0"><thead><tr><th>Bilan ${y}</th><th>Droits</th><th>Posé</th><th>Hypo.</th><th>Reste</th></tr></thead><tbody>${rows}</tbody></table>
    ${warns.join("")}
    ${caCapLine(y)}
    ${rcCapLine(y)}
    <p class="hint">CA ${y-1} = reliquat au 1er janvier, consommé en premier par les CA posés avant le 1er mai. CA ${y} = droits crédités le 1er mai ; son reste est le reliquat prévu au 31/12. Posé inclut le CET. RC : reste = solde prévu au 31/12. FL en jours.</p>
    <button class="toggle" id="editDroits">Régler les droits annuels</button></div>`;
}
const capCA = () => state.capCA ?? 70;
const capRC = () => state.capRC ?? 100;
function rcCapLine(y){
  const v = soldeAt("RC", `${y}-12-31`);
  if (v===null) return "";
  const cap = capRC(), over = v - cap;
  return over > 0.009
    ? `<p class="warn" style="margin:8px 0 0">RC prévues au 31/12/${y} : ${fmt(v)} h. Au-delà de ${fmt(cap)} h elles sont écrêtées : placez au moins ${fmt(over)} h au CET avant le 31/12 (bouton +, Versement CET, RC).</p>`
    : `<p class="hint" style="margin:4px 0 0">RC prévues au 31/12/${y} : <b>${fmt(v)} h</b> (écrêtement au-delà de ${fmt(cap)} h).</p>`;
}
function caCapLine(y){
  const v = soldeAt("CA", `${y}-12-31`);
  if (v===null) return "";
  const cap = capCA(), over = v - cap;
  return over > 0.009
    ? `<p class="warn" style="margin:8px 0 0">Reliquat CA prévu au 31/12/${y} : ${fmt(v)} h, soit ${fmt(over)} h au-delà du maximum de ${fmt(cap)} h, qui seront perdues. À poser ou à verser au CET avant le 31/12.</p>`
    : `<p class="hint" style="margin:8px 0 0">Reliquat CA prévu au 31/12/${y} : <b>${fmt(v)} h</b> (maximum ${fmt(cap)} h).</p>`;
}

}

  const list = (state.astreintes||[]).filter(a=>a.debut.slice(0,4)===String(calYear)).sort((a,b)=>a.debut.localeCompare(b.debut));
  let html = `<div class="card">

async function download(name, text, type){
  const blob = new Blob([text], {type});
  try { const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; } }
  catch(e){ if (e && e.name==="AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}
function toCSV(){
  const q = v => { const t = String(v??""); return /[;"\n]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  const num2 = n => String(Math.round(n*100)/100).replace(".", ",");
  const rows = [["categorie","date","fin","compteur","heures_ou_jours","type","statut","moment","de","a","note"]];
  for (const m of allM(true).sort((a,b)=>a.date.localeCompare(b.date)))
    rows.push([m.virt?"automatique":"saisie", m.date, m.fin||"", C[m.c].short, num2(m.h), KIND[m.kind], m.statut==="hypo"?"hypothèse":(m.kind==="absence"?"posé":""), m.moment?MOM[m.moment]:"", m.de||"", m.a||"", m.note||""]);
  for (const r of [...state.releves].sort((a,b)=>a.date.localeCompare(b.date)))
    for (const k of KEYS) rows.push(["releve_PGI", r.date, "", C[k].short, num2(num(r.soldes[k])), "Solde PGI", "", "", "", "", k==="RC"&&r.soldes.RCd ? RCT.map(([t,l])=>`${l} ${num2(r.soldes.RCd[t]||0)}`).join(" / ") : ""]);
  for (const a of [...state.astreintes].sort((x,y)=>x.debut.localeCompare(y.debut)))
    rows.push(["astreinte", a.debut, a.fin, "", "", "Astreinte", "", "", "17:00", "17:00", ""]);
  return "\ufeff" + rows.map(r=>r.map(q).join(";")).join("\n");
}

      </div>`;
    const keep = () => { const d = $("#sdate"); if (d) s.date = d.value; };
    f.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{keep(); s.mode=b.dataset.v; draw();});
    f.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{keep(); s.c=b.dataset.c; draw();});
    $("#scancel").onclick=()=>$("#dlg").close();
    $("#sok").onclick=()=>{ keep(); if (s.mode!=="ca" && !s.date) return;
      state.solidarite = {...(state.solidarite||{}), [y]: s}; save(); $("#dlg").close(); render(); };
    const del = $("#sdel"); if (del) del.onclick=()=>{ const o = {...state.solidarite}; delete o[y]; state.solidarite = o; save(); $("#dlg").close(); render(); };
  };
  draw();
  $("#dlg").showModal();
}

// --- Formulaire absence ---
function autoHours(m){
  if (m.kind!=="absence") return;
  const fin = m.fin && m.fin > m.date ? m.fin : m.date;
  if (C[m.c].u==="j"){ m.h = fin===m.date ? 1 : workDays(m.date, fin); return; }
  if (m.moment==="am"){ m.h = 4.25; return; }
  if (m.moment==="pm"){ m.h = 3.75; return; }
  if (m.moment==="heures"){ m.h = hoursBetween(m.de||"15:00", m.a||"16:30"); return; }
  m.h = 8 * (fin===m.date ? 1 : workDays(m.date, fin));
}
function openForm(m, date){
  const isNew = !m;
  m = m ? {...m} : {id:uid(), date:date||today(), fin:"", c:"CA", h:8, kind:"absence", moment:"jour", statut: (date||today()) > today() ? "hypo" : "", note:""};
  const f = $("#mform");
  const draw = () => {
    const abs = m.kind==="absence";
    f.innerHTML = `<h2>${isNew?"Ajouter":"Modifier"}</h2>
      <label>Type</label>
      <div class="seg" id="fkind">${Object.entries(KIND).filter(([k])=>k!=="perte").map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${m.kind===k}">${l}</button>`).join("")}</div>
      <label>Compteur</label>
      <div class="seg" id="fc">${KEYS.map(k=>`<button type="button" data-v="${k}" aria-pressed="${m.c===k}" style="${colorVars(k)}">${C[k].short}</button>`).join("")}</div>
      ${abs ? `<label>Statut</label>
      <div class="seg" id="fst"><button type="button" data-v="" aria-pressed="${m.statut!=="hypo"}">Posé dans PGI</button><button type="button" data-v="hypo" aria-pressed="${m.statut==="hypo"}">Hypothèse</button></div>` : ""}
      <div class="row">
        <div><label for="fdate">${abs?"Du":"Date"}</label><input type="date" id="fdate" value="${m.date}"></div>
        ${abs ? `<div><label for="ffin">Au (facultatif)</label><input type="date" id="ffin" value="${m.fin||m.date}" min="${m.date}"></div>` : ""}
      </div>
      ${abs && C[m.c].u!=="j" ? `<div class="seg" id="fmom" style="margin-top:10px;${m.fin && m.fin>m.date ? "display:none" : ""}">${Object.entries(MOM).map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${(m.moment||"jour")===k}">${l}</button>`).join("")}</div>` : ""}
      ${abs && C[m.c].u!=="j" ? `<div class="row" id="fheures" style="${m.moment==="heures" && !(m.fin && m.fin>m.date) ? "" : "display:none"}"><div><label for="fde">De</label><input type="time" id="fde" value="${m.de||"15:00"}" step="900"></div><div><label for="fa">À</label><input type="time" id="fa" value="${m.a||"16:30"}" step="900"></div></div>` : ""}
      <label for="fh">${C[m.c].u==="j"?"Jours":"Heures"}</label><input id="fh" inputmode="decimal" value="${fmt(m.h)}">
      <p class="warn" id="fwarn" ${abs && astConflict(m) ? "" : "hidden"}>Attention : cette absence tombe pendant une astreinte.</p>
      <label for="fnote">Note</label><textarea id="fnote" placeholder="facultatif">${esc(m.note)}</textarea>
      <div class="actions">
        ${isNew?"":`<button type="button" class="btn danger" id="fdel">Supprimer</button>`}
        <button type="button" class="btn ghost" id="fcancel">Annuler</button>
        <button type="button" class="btn" id="fok">${isNew?"Ajouter":"Enregistrer"}</button>
      </div>`;
    const keep = () => { m.date=$("#fdate").value; const fi=$("#ffin"); m.fin = fi ? fi.value : ""; m.h=num($("#fh").value); m.note=$("#fnote").value;
      const de=$("#fde"), aa=$("#fa"); if (de){ m.de=de.value; m.a=aa.value; } };
    const redo = fn => () => { keep(); fn(); draw(); };
    f.querySelectorAll("#fkind button").forEach(b=>b.onclick=redo(()=>{ m.kind=b.dataset.v; }));
    f.querySelectorAll("#fc button").forEach(b=>b.onclick=redo(()=>{ m.c=b.dataset.v; autoHours(m); }));
    f.querySelectorAll("#fst button").forEach(b=>b.onclick=redo(()=>{ m.statut=b.dataset.v; }));
    f.querySelectorAll("#fmom button").forEach(b=>b.onclick=redo(()=>{ m.moment=b.dataset.v; autoHours(m); }));
    const refresh = () => {
      $("#fh").value = fmt(m.h);
      const mo = $("#fmom"); if (mo) mo.style.display = (m.fin && m.fin > m.date) ? "none" : "";
      const fhr = $("#fheures"); if (fhr) fhr.style.display = (m.moment==="heures" && !(m.fin && m.fin > m.date)) ? "" : "none";
      const w = $("#fwarn"); if (w) w.hidden = !(m.kind==="absence" && astConflict(m));
    };
    // Pas de ré-affichage du formulaire sur les dates : sinon le calendrier iOS se referme
    $("#fdate").onchange = () => { keep(); const fi = $("#ffin");
      if (fi){ fi.min = m.date; if (!m.fin || m.fin < m.date){ m.fin = m.date; fi.value = m.date; } }
      autoHours(m); refresh(); };
    const fi = $("#ffin"); if (fi) fi.onchange = () => { keep();
      if (m.fin && m.fin > m.date){ m.moment = "jour"; f.querySelectorAll("#fmom button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v==="jour")); }
      autoHours(m); refresh(); };
    ["#fde","#fa"].forEach(id=>{ const el = $(id); if (el) el.onchange = () => { keep(); autoHours(m); refresh(); }; });
    $("#fcancel").onclick=()=>$("#dlg").close();
    $("#fok").onclick=()=>{ keep(); if(!m.date||!(m.h>0)) return;
      if (m.kind!=="absence"){ delete m.fin; delete m.moment; delete m.statut; }
      if (!m.fin || m.fin<=m.date) delete m.fin;
      if (m.moment!=="heures" || m.fin){ delete m.de; delete m.a; if (m.moment==="heures") m.moment="jour"; }
      if (!m.statut) delete m.statut;
      state.mouvements = state.mouvements.filter(x=>x.id!==m.id).concat(m); save(); $("#dlg").close(); render(); };
    const d = $("#fdel"); if (d) d.onclick=()=>{ state.mouvements = state.mouvements.filter(x=>x.id!==m.id); save(); $("#dlg").close(); render(); };
  };
  draw();
  $("#dlg").showModal();
}

function render(){
  _ecret = null;
  renderTop();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  $("#fab").style.display = (tab==="plan"||tab==="annee") ? "" : "none";
  const v = $("#view");
  if (tab==="plan"){
    v.innerHTML = renderSol() + renderPlan();
    v.querySelectorAll("[data-sol]").forEach(b=>b.onclick=()=>openSol(b.dataset.sol));
    v.querySelectorAll(".item[data-id]").forEach(b=>b.onclick=()=>{ const id=b.dataset.id;
      if (id.startsWith("sol-")) return openSol(id.slice(4));
      if (id.startsWith("dr-")) return openDroits();
      if (id.startsWith("ec-")) return;
      openForm(state.mouvements.find(m=>m.id===id)); });
  } else if (tab==="annee"){
    v.innerHTML = renderAnnee();
    v.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>openDay(b.dataset.day));
    const pm = $("#pastMonths"); if (pm) pm.ontoggle = () => { pastOpen = pm.open; };
  } else if (tab==="ast"){
    v.innerHTML = renderAst();
    $("#astDeb").oninput = e => { const x = e.target.value; $("#astInfo").innerHTML = x ? astInfoText(x) : "La fin est calculée automatiquement : le jeudi suivant à 17 h."; };
    $("#astAdd").onclick = () => { const x = $("#astDeb").value; if (!x) return;
      state.astreintes = (state.astreintes||[]).concat({id:uid(), debut:x, fin:addDays(x,7)}); save(); render(); };
    v.querySelectorAll("[data-dela]").forEach(b=>b.onclick=()=>{ state.astreintes = state.astreintes.filter(a=>a.id!==b.dataset.dela); save(); render(); });
  } else if (tab==="aide"){
    v.innerHTML = renderAide();
  } else if (tab==="set"){
    v.innerHTML = renderSet();
    const stamp = () => new Date().toISOString().slice(0,10);
    $("#expJson").onclick = () => { state.lastExport = new Date().toISOString(); save();
      download(`mes-conges-sauvegarde-${stamp()}.json`, JSON.stringify(state, null, 1), "application/json"); render(); };
    $("#expCsv").onclick = () => download(`mes-conges-${stamp()}.csv`, toCSV(), "text/csv;charset=utf-8");
    $("#impJson").onclick = () => $("#impFile").click();
    $("#impFile").onchange = async e => { const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); if (!d.releves || !d.mouvements) throw 0;
        if (!confirm("Remplacer toutes les données de cet appareil par cette sauvegarde ?")) return;
        state = normalize(d); save(); render(); }
      catch(err){ $("#setMsg").textContent = "Ce fichier n’est pas une sauvegarde PGI suivi perso."; } };
    $("#setDroits").onclick = openDroits;
    $("#vAdd").onclick = () => { const n=$("#vN").value.trim(), d=$("#vD").value, f=$("#vF").value;
      if (!d || !f || f<d) return; state.vacances = state.vacances.concat({id:uid(), n:n||"Vacances", debut:d, fin:f}); save(); render(); };
    v.querySelectorAll("[data-delv]").forEach(b=>b.onclick=()=>{ if (!confirm("Supprimer cette période ?")) return;
      state.vacances = state.vacances.filter(x=>x.id!==b.dataset.delv); save(); render(); });
  } else {
    v.innerHTML = renderRel() + renderReleve() + `<div class="month">Historique ${calYear}</div>` + renderHist();
    $("#relSave").onclick = () => { const ca=$("#relCA").value, rc=$("#relRC").value, dt=$("#relD").value; if (!dt || (ca==="" && rc==="")) return;
      state.reliquats = {...(state.reliquats||{}), [calYear]: {date:dt, ...(ca!==""?{CA:num(ca)}:{}), ...(rc!==""?{RC:num(rc)}:{})}}; save(); render(); };
    const rd = $("#relDel"); if (rd) rd.onclick = () => { const o = {...state.reliquats}; delete o[calYear]; state.reliquats = o; save(); render(); };
    v.querySelectorAll("[data-delr]").forEach(b=>b.onclick=()=>{
      if (!confirm("Supprimer ce relevé ?")) return;
      state.releves = state.releves.filter(r=>r.date!==b.dataset.delr); save(); render();});
    v.querySelectorAll(".card input").forEach(i=>{ if (!i.id.startsWith("rel")) i.oninput=releveCompare; }); releveCompare();
    $("#rsave").onclick = () => {
      const date = $("#rdate").value; if (!date) return;
      const soldes = {}; let any = false;
      for (const k of KEYS){ const x = rv(k); if (x!=="") any = true; soldes[k] = x===""?0:num(x); }
      soldes.RCd = Object.fromEntries(RCT.map(([t])=>[t, num($("#r_RC_"+t).value)]));
      if (!any){ $("#rcmp").insertAdjacentHTML("beforeend",`<p class="hint">Saisissez au moins un solde.</p>`); return; }
      state.releves = state.releves.filter(r=>r.date!==date).concat({date, soldes});
      save(); render();
    };
  }
}

function save(){
  try { localStorage.setItem("conges-state", JSON.stringify(state)); $("#status").textContent = statusText(); }
  catch(e){ $("#status").textContent = "Échec de l’enregistrement sur cet appareil."; }
}
function statusText(){
  const d = state.lastExport;
  if (!d) return "Données enregistrées sur cet iPhone. Pensez à exporter une sauvegarde (Réglages).";
  const days = Math.floor((Date.now() - new Date(d).getTime())/864e5);
  return days > 31 ? `Dernière sauvegarde il y a ${days} jours : exportez-en une nouvelle (Réglages).` : `Dernière sauvegarde : ${flong(d.slice(0,10))}.`;
}
const normalize = d => ({releves:d.releves||[], mouvements:d.mouvements||[], solidarite:d.solidarite||{}, astreintes:d.astreintes||[],
  vacances: (d.vacances && d.vacances.length) ? d.vacances : DEFAULT_VAC.map(v=>({...v, id:uid()})),
  ...(d.droits?{droits:d.droits}:{}), ...(d.capCA!=null?{capCA:d.capCA}:{}), ...(d.capRC!=null?{capRC:d.capRC}:{}), reliquats: d.reliquats||{}, ...(d.lastExport?{lastExport:d.lastExport}:{})});

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
$("#fab").onclick=()=>openForm(null);
$("#dlg").addEventListener("click", e=>{ if(e.target.id==="dlg") $("#dlg").close(); });

let loaded = null;
try { loaded = JSON.parse(localStorage.getItem("conges-state")||"null"); } catch(e){}
state = normalize(loaded || SEED);
if (!loaded) save();
render();
$("#status").textContent = statusText();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
